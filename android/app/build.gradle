plugins {
    id "com.android.application"
}

def codedailyUrl = providers.gradleProperty("codedailyUrl").getOrElse("https://your-service.onrender.com")

android {
    namespace "com.codedaily.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.codedaily.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "CODEDAILY_URL", "\"${codedailyUrl}\""
    }

    buildFeatures {
        buildConfig true
    }
}
